name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "build"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      run: cargo fmt --check

    - name: Check clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  test-musl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install Cross
      run: cargo install cross --git https://github.com/cross-rs/cross

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "musl"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build MUSL binary
      run: LIBZ_SYS_STATIC=1 cross build --target x86_64-unknown-linux-musl --verbose

    - name: Run tests on MUSL
      run: LIBZ_SYS_STATIC=1 cross test --target x86_64-unknown-linux-musl --verbose

    - name: Verify binary is static
      run: |
        file target/x86_64-unknown-linux-musl/debug/aSTRonaut
        ldd target/x86_64-unknown-linux-musl/debug/aSTRonaut || echo "Static binary confirmed"
